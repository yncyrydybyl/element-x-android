name: Live location E2E

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx3g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -Dsonar.gradle.skipCompile=true --no-configuration-cache --build-cache

jobs:
  e2e:
    name: Live location E2E (synapse + emulator + verifier)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      synapse:
        image: matrixdotorg/synapse:latest
        env:
          SYNAPSE_SERVER_NAME: e2e.local
          SYNAPSE_REPORT_STATS: "no"
          SYNAPSE_CONFIG_DIR: /data
          SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
          UID: "0"
          GID: "0"
        ports:
          - 8008:8008
        # The image expects config on /data. We'll copy ours in via an init script
        # mounted through the host working dir (see setup step).
        volumes:
          - ${{ github.workspace }}/scripts/e2e/synapse:/e2e-config
        options: >-
          --health-cmd "curl -sf http://localhost:8008/_matrix/client/versions || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      # Provide config files to the synapse container (service starts before checkout,
      # so on first boot its /data is empty and synapse generates its own config. We
      # recreate the service via docker commands to pick up our config.)
      - name: Stage synapse config
        run: |
          set -euxo pipefail
          sudo mkdir -p /srv/synapse-data
          sudo cp scripts/e2e/synapse/homeserver.yaml /srv/synapse-data/homeserver.yaml
          sudo cp scripts/e2e/synapse/log.config /srv/synapse-data/log.config
          sudo chown -R 991:991 /srv/synapse-data || true

      - name: Start Synapse (standalone container)
        run: |
          set -euxo pipefail
          docker rm -f synapse_e2e || true
          # Generate signing key first
          docker run --rm \
            -v /srv/synapse-data:/data \
            -e SYNAPSE_SERVER_NAME=e2e.local \
            -e SYNAPSE_REPORT_STATS=no \
            matrixdotorg/synapse:latest generate
          # Overlay our config on top of generated one
          sudo cp scripts/e2e/synapse/homeserver.yaml /srv/synapse-data/homeserver.yaml
          sudo cp scripts/e2e/synapse/log.config /srv/synapse-data/log.config
          sudo chown -R 991:991 /srv/synapse-data || true
          docker run -d --name synapse_e2e \
            -p 8008:8008 \
            -v /srv/synapse-data:/data \
            matrixdotorg/synapse:latest
          for i in {1..60}; do
            if curl -sf http://localhost:8008/_matrix/client/versions; then
              echo "Synapse ready."; break
            fi
            sleep 2
          done

      - name: Register users and create room
        run: |
          chmod +x scripts/e2e/setup-synapse.sh
          scripts/e2e/setup-synapse.sh

      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Assemble debug APK (gplay)
        env:
          ELEMENT_ANDROID_MAPTILER_API_KEY: ${{ secrets.MAPTILER_KEY }}
        run: ./gradlew :app:assembleGplayDebug $CI_GRADLE_ARG_PROPERTIES

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install Python deps (verifier)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/e2e/requirements.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator + run Maestro flow + verifier
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            set -euxo pipefail
            adb install app/build/outputs/apk/gplay/debug/app-gplay-arm64-v8a-debug.apk || \
              adb install app/build/outputs/apk/gplay/debug/app-gplay-x86_64-debug.apk
            # Grant location permissions up-front so the Maestro flow isn't blocked.
            adb shell pm grant io.element.android.x.debug android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant io.element.android.x.debug android.permission.ACCESS_COARSE_LOCATION
            # Seed a synthetic location (Berlin center).
            adb emu geo fix 13.4050 52.5200 || true
            # Kick off the verifier in the background; it logs to stdout.
            HS_URL=http://localhost:8008 \
              python3 scripts/e2e/verify_beacon.py > verifier.log 2>&1 &
            VERIFIER_PID=$!
            # Drive the Android app through the live-location flow.
            export MAESTRO_HOMESERVER_URL=http://10.0.2.2:8008
            export MAESTRO_USER="$E2E_SENDER_USER"
            export MAESTRO_PASSWORD="$E2E_SENDER_PASS"
            export MAESTRO_ROOM_NAME="e2e"
            maestro test scripts/e2e/maestro/live-location.yaml || {
              echo "Maestro flow failed. Verifier log so far:"; cat verifier.log; exit 1;
            }
            # After sharing starts, nudge the GPS a few times so beacons fire.
            for i in 1 2 3 4; do
              adb emu geo fix $(echo "13.4050 + 0.001 * $i" | bc -l) $(echo "52.5200 + 0.001 * $i" | bc -l)
              sleep 4
            done
            # Wait for the verifier to conclude.
            wait $VERIFIER_PID
            echo "--- verifier.log ---"; cat verifier.log

      - name: Upload Maestro + verifier artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-location-e2e
          path: |
            verifier.log
            ~/.maestro/tests/**
            /tmp/artifacts
