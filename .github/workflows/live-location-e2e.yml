name: Live location E2E

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/live-location-e2e.yml'
      - 'scripts/e2e/**'

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx3g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -Dsonar.gradle.skipCompile=true --no-configuration-cache --build-cache
  # Pin Synapse by version tag (zizmor: not :latest).
  SYNAPSE_IMAGE: "matrixdotorg/synapse:v1.116.0"

jobs:
  e2e:
    name: Live location E2E (synapse + emulator + verifier)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start Synapse (standalone container)
        run: |
          set -euxo pipefail
          sudo rm -rf /srv/synapse-data
          sudo mkdir -p /srv/synapse-data
          sudo chown -R 991:991 /srv/synapse-data || true
          docker rm -f synapse_e2e >/dev/null 2>&1 || true
          # Let Synapse generate its own default config + signing key.
          docker run --rm \
            -v /srv/synapse-data:/data \
            -e SYNAPSE_SERVER_NAME=e2e.local \
            -e SYNAPSE_REPORT_STATS=no \
            "$SYNAPSE_IMAGE" generate
          # Append our open-registration overrides to the generated config.
          sudo tee -a /srv/synapse-data/homeserver.yaml < scripts/e2e/synapse/overrides.yaml >/dev/null
          sudo chown -R 991:991 /srv/synapse-data || true
          docker run -d --name synapse_e2e \
            -p 8008:8008 \
            -v /srv/synapse-data:/data \
            "$SYNAPSE_IMAGE"
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8008/_matrix/client/versions >/dev/null; then
              echo "Synapse ready."
              exit 0
            fi
            sleep 2
          done
          echo "Synapse failed to come up. Container logs:"
          docker logs synapse_e2e || true
          exit 1

      - name: Register users and create room
        run: |
          chmod +x scripts/e2e/setup-synapse.sh
          scripts/e2e/setup-synapse.sh

      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-read-only: false

      - name: Assemble debug APK (gplay)
        run: ./gradlew :app:assembleGplayDebug $CI_GRADLE_ARG_PROPERTIES

      - name: Install Maestro (pre-step, cache purposes)
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version || true

      - name: Install Python deps (verifier)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/e2e/requirements.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator + run Maestro flow + verifier
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            # IMPORTANT: don't use set -e — the emulator-runner action passes
            # failures through and a single unexpected RC would prevent any
            # diagnostics from being emitted. Only set -x for trace.
            set +e
            set -x

            mkdir -p e2e-artifacts
            echo "boot" > e2e-artifacts/.alive

            # Always dump whatever we've got on exit.
            emit_annotation() {
              local level=$1; local title=$2; local path=$3
              if [ -s "$path" ]; then
                local msg
                msg=$(tail -c 4000 "$path" | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g')
                echo "::${level} title=${title}::${msg}"
              fi
            }
            on_exit() {
              echo "=== on_exit: artifacts dir ==="
              ls -la e2e-artifacts/ || true
              echo "=== verifier.log ==="
              cat e2e-artifacts/verifier.log 2>/dev/null || echo "(no verifier.log)"
              echo "=== maestro.log (tail 200) ==="
              tail -n 200 e2e-artifacts/maestro.log 2>/dev/null || echo "(no maestro.log)"
              echo "=== logcat (tail 100) ==="
              tail -n 100 e2e-artifacts/logcat.txt 2>/dev/null || echo "(no logcat.txt)"
              emit_annotation warning "maestro.log (tail)" e2e-artifacts/maestro.log
              emit_annotation warning "verifier.log" e2e-artifacts/verifier.log
              emit_annotation warning "logcat (tail)" e2e-artifacts/logcat.txt
              echo "::notice title=e2e trap::exit=${1:-?} maestro_rc=${MAESTRO_RC:-?} verifier_rc=${VERIFIER_RC:-?}"
            }
            trap 'on_exit $?' EXIT

            # Install Maestro inside this step since $GITHUB_PATH propagation
            # through reactivecircus/android-emulator-runner is unreliable.
            if [ ! -x "$HOME/.maestro/bin/maestro" ]; then
              curl -Ls "https://get.maestro.mobile.dev" | bash
            fi
            export PATH="$HOME/.maestro/bin:$PATH"

            echo "=== environment ==="
            echo "pwd=$(pwd)"
            echo "PATH=$PATH"
            echo "HOME=$HOME"
            which adb || true
            which maestro || true
            maestro --version || true

            mkdir -p e2e-artifacts

            echo "=== APKs produced ==="
            ls -la app/build/outputs/apk/gplay/debug/ || true

            adb logcat -c || true
            adb logcat -v time > e2e-artifacts/logcat.txt 2>&1 &
            LOGCAT_PID=$!

            echo "=== APK install ==="
            adb install app/build/outputs/apk/gplay/debug/app-gplay-x86_64-debug.apk \
              || adb install app/build/outputs/apk/gplay/debug/app-gplay-arm64-v8a-debug.apk \
              || adb install app/build/outputs/apk/gplay/debug/app-gplay-universal-debug.apk \
              || echo "APK install FAILED"

            adb shell pm grant io.element.android.x.debug android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant io.element.android.x.debug android.permission.ACCESS_COARSE_LOCATION || true
            adb emu geo fix 13.4050 52.5200 || true

            echo "=== starting verifier in background ==="
            HS_URL=http://localhost:8008 \
              python3 scripts/e2e/verify_beacon.py > e2e-artifacts/verifier.log 2>&1 &
            VERIFIER_PID=$!

            export MAESTRO_HOMESERVER_URL=http://10.0.2.2:8008
            export MAESTRO_USER="${E2E_SENDER_USER:-}"
            export MAESTRO_PASSWORD="${E2E_SENDER_PASS:-}"
            export MAESTRO_ROOM_NAME="e2e"

            echo "=== maestro version ==="
            maestro --version || echo "maestro not runnable"

            echo "=== running maestro ==="
            maestro test \
              --debug-output e2e-artifacts/maestro \
              scripts/e2e/maestro/live-location.yaml \
              2>&1 | tee e2e-artifacts/maestro.log
            MAESTRO_RC=${PIPESTATUS[0]}
            echo "maestro exited with rc=$MAESTRO_RC"

            for i in 1 2 3 4; do
              lon=$(awk "BEGIN { printf \"%.4f\", 13.4050 + 0.001 * $i }")
              lat=$(awk "BEGIN { printf \"%.4f\", 52.5200 + 0.001 * $i }")
              adb emu geo fix "$lon" "$lat" || true
              sleep 4
            done

            VERIFIER_RC=0
            wait "$VERIFIER_PID" || VERIFIER_RC=$?

            adb exec-out screencap -p > e2e-artifacts/final-screen.png 2>/dev/null || true
            kill "$LOGCAT_PID" 2>/dev/null || true

            # Diagnostics are printed via the EXIT trap; just return the
            # combined rc so GitHub marks the step failure appropriately.
            test "${MAESTRO_RC:-99}" = 0 && test "${VERIFIER_RC:-99}" = 0

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: live-location-e2e
          path: e2e-artifacts/
          if-no-files-found: warn
