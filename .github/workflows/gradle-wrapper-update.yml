name: Update Gradle Wrapper

on:
  workflow_dispatch:
  # Scheduled runs disabled in this fork: the upstream job needs the
  # DANGER_GITHUB_API_TOKEN secret (unset here), so the daily cron only produced
  # failing runs ("repo-token cannot be empty"). Trigger manually if needed.

permissions: {}

jobs:
  update-gradle-wrapper:
    runs-on: ubuntu-latest
    # Skip in forks
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'element-hq/element-x-android' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        name: Use JDK 21
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Update Gradle Wrapper
        uses: gradle-update/update-gradle-wrapper-action@512b1875f3b6270828abfe77b247d5895a2da1e5 # v2.1.0
        with:
          repo-token: ${{ secrets.DANGER_GITHUB_API_TOKEN }}
          target-branch: develop
          labels: PR-Build
