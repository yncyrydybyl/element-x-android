# Maestro flow: drive Element X through the live-location sharing flow
# against a local Synapse homeserver.
#
# Required env vars (exported by setup-synapse.sh + workflow):
#   MAESTRO_HOMESERVER_URL   e.g. http://10.0.2.2:8008
#   MAESTRO_USER             e.g. sender
#   MAESTRO_PASSWORD         e.g. senderpass123
#   MAESTRO_ROOM_NAME        e.g. e2e
appId: io.element.android.x.debug
---
- launchApp:
    clearState: true

# Welcome screen ("Be in your element") → tap the manual sign-in button.
- extendedWaitUntil:
    visible:
      text: "Be in your element"
    timeout: 30000

- tapOn:
    text: "Sign in manually"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Sign in to .*"
    optional: true

# Confirm account provider screen — choose "Change account provider".
- tapOn:
    text: "Change account provider"
    optional: true
- tapOn:
    text: "Other"
    optional: true

# Select your server screen — enter custom homeserver URL.
- extendedWaitUntil:
    visible:
      text: "Select your server"
    timeout: 15000
- tapOn:
    text: "Homeserver URL"
- eraseText
- inputText: ${MAESTRO_HOMESERVER_URL}
- tapOn:
    text: "Continue"

# Account provider confirmation (if shown).
- tapOn:
    text: "Continue"
    optional: true

# Login form: "Welcome back!" / "Enter your details".
- extendedWaitUntil:
    visible:
      text: "Enter your details"
    timeout: 30000
- tapOn:
    text: "Username"
- inputText: ${MAESTRO_USER}
- tapOn:
    text: "Password"
- inputText: ${MAESTRO_PASSWORD}
- tapOn:
    text: "Continue"

# Skip analytics / session verification / encryption prompts.
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Later"
    optional: true
- tapOn:
    text: "I'll do it later"
    optional: true
- tapOn:
    text: "Skip"
    optional: true

# Room list: open the shared room.
- extendedWaitUntil:
    visible:
      text: ${MAESTRO_ROOM_NAME}
    timeout: 90000
- tapOn:
    text: ${MAESTRO_ROOM_NAME}

# Location pin in the top app bar opens Share Location directly.
- tapOn:
    text: "Share live location"
    optional: true

# If we landed in the attachment sheet instead, pick Share Location.
- tapOn:
    text: "Share location"
    optional: true
- tapOn:
    text: "Share live location"
    optional: true

# Accept Android runtime permission dialog (if it appears on top).
- runFlow:
    when:
      visible:
        text: "While using the app"
    commands:
      - tapOn: "While using the app"
- runFlow:
    when:
      visible:
        text: "Allow"
    commands:
      - tapOn: "Allow"

# Privacy disclaimer ("Share your live location?" → Continue).
- extendedWaitUntil:
    visible:
      text: "Share your live location?"
    timeout: 20000
- tapOn:
    text: "Continue"

# Duration picker — pick the shortest.
- extendedWaitUntil:
    visible:
      text: "15 minutes"
    timeout: 15000
- tapOn:
    text: "15 minutes"
- tapOn:
    text: "Continue"

# Confirm the banner appeared so we know sharing is active.
- extendedWaitUntil:
    visible:
      text: "You are sharing your live location"
    timeout: 60000
