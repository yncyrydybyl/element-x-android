# Overrides appended to the synapse-generated homeserver.yaml.
# Enables open registration so setup-synapse.sh can create test users.
registration_shared_secret: "e2eregistration"
enable_registration: true
enable_registration_without_verification: true
enable_registration_captcha: false
rc_registration:
  per_second: 1000
  burst_count: 1000
rc_message:
  per_second: 1000
  burst_count: 1000
rc_login:
  address:
    per_second: 1000
    burst_count: 1000
  account:
    per_second: 1000
    burst_count: 1000
trusted_key_servers: []

# Simplified Sliding Sync (MSC4186) — Element X refuses servers that
# don't advertise it.
experimental_features:
  msc4186_enabled: true
  # Legacy sliding-sync proxy compatibility (MSC3575) belt-and-suspenders.
  msc3575_enabled: true
